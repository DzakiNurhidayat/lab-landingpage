name: CI/CD Pipeline - Deploy to Azure ACI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout kode
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Login ke ACR
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: acrlandingpagekota301
          password: ${{ secrets.ACR_PASSWORD }}

      # Step 3: Build dan Push Docker image
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.REGISTRY_URL }}/repo-landingpage-kota301:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY_URL }}/repo-landingpage-kota301:${{ github.sha }}

      # Step 4: Install Azure CLI & Login
      - name: Login to Azure
        run: |
          az login --username ${{ secrets.AZURE_USERNAME }} --password ${{ secrets.AZURE_PASSWORD }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 5: Deploy ke ACI
      - name: Deploy to ACI
        run: |
          az container create --resource-group rg-lab-docker --name ${{ secrets.SERVICE_NAME }} --image ${{ secrets.REGISTRY_URL }}/repo-landingpage-kota301:${{ github.sha }} --cpu 1 --memory 1 --registry-login-server ${{ secrets.REGISTRY_URL }} --registry-username acrlandingpagekota301 --registry-password ${{ secrets.ACR_PASSWORD }} --dns-name-label landingpage-kota301 --ports 80 --os-type Linux